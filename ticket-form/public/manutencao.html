<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir Chamado Técnico</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 32px 16px 64px;
      color: #222;
    }

    .page-header {
      max-width: 680px;
      margin: 0 auto 24px;
    }

    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1a1a2e;
    }

    .page-header p {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #666;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #d32f2f;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover { text-decoration: underline; }

    .section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.08);
      padding: 28px 32px;
      max-width: 680px;
      margin: 0 auto 20px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #d32f2f;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #fde7e7;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .section { padding: 20px 18px; }
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    label .req { color: #e53e3e; margin-left: 2px; }

    input[type="text"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 0.93rem;
      font-family: inherit;
      color: #222;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #d32f2f;
    }

    textarea { resize: vertical; min-height: 110px; }

    /* Priority dropdown — colored options */
    select[name="prioridade"] {
      font-weight: 600;
    }

    /* Radio group */
    .radio-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      color: #333;
    }

    .radio-group input[type="radio"] {
      width: 16px; height: 16px;
      accent-color: #d32f2f;
      cursor: pointer;
    }

    /* Choice cards (Tipo de Serviço, Demandas) */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .choice-card {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 10px;
      border: 2px solid #e2e6ee;
      border-radius: 10px;
      background: #fafbfd;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a2e;
    }
    .choice-card:hover { border-color: #d32f2f; background: #fef2f2; transform: translateY(-1px); }
    .choice-card:has(input:checked) { border-color: #d32f2f; background: #fef2f2; }
    .choice-card input { position: absolute; opacity: 0; pointer-events: none; }
    .choice-card-icon { font-size: 1.3rem; line-height: 1; }

    /* Attachments uploader */
    .anexos-uploader { display: flex; flex-direction: column; gap: 12px; }
    .upload-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 24px; border: 2px dashed #cbd5e1; border-radius: 10px;
      background: #f8fafc; cursor: pointer; transition: border-color .15s, background .15s;
      text-align: center;
    }
    .upload-zone:hover { border-color: #d32f2f; background: #fef2f2; }
    .upload-icon { font-size: 1.5rem; }
    .upload-text { font-size: 0.88rem; color: #555; }
    .anexos-list { display: flex; flex-direction: column; gap: 6px; }
    .anexos-list:empty { display: none; }
    .anexos-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #f1f5f9; border-radius: 6px; font-size: 0.85rem;
    }
    .anexos-item-info { display: flex; gap: 8px; align-items: center; overflow: hidden; min-width: 0; }
    .anexos-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .anexos-item-size { color: #888; font-size: 0.78rem; flex-shrink: 0; }
    .anexos-item-remove {
      background: transparent; border: none; cursor: pointer; color: #b91c1c;
      font-size: 1.2rem; padding: 0 6px; line-height: 1;
    }

    /* Submit */
    .submit-section { max-width: 680px; margin: 0 auto; }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button[type="submit"]:hover:not(:disabled) { background: #b71c1c; }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 9px;
      font-size: 0.92rem;
      display: none;
    }

    #message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      display: block;
      animation: shake .4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .btn-loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .success-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      text-align: center;
      max-width: 460px;
      width: 90%;
      animation: slideUp .5s cubic-bezier(.22,.68,0,1.1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: popIn .5s cubic-bezier(.22,.68,0,1.3) .2s both;
    }

    @keyframes popIn {
      from { transform: scale(0); } to { transform: scale(1); }
    }

    .success-icon svg {
      width: 36px; height: 36px;
      stroke: #fff; stroke-width: 3; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .success-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .success-card p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .os-badge {
      display: inline-block;
      margin: 0 0 20px;
      padding: 6px 14px;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 6px;
      font-family: 'SF Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .btn-new {
      display: inline-block;
      padding: 12px 32px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-new:hover { background: #b71c1c; }

    /* Typeahead (autocomplete de cliente) */
    .typeahead { position: relative; }
    .typeahead-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1.5px solid #d32f2f;
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      z-index: 10;
      display: none;
    }
    .typeahead-list.is-open { display: block; }
    .typeahead-item {
      padding: 9px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }
    .typeahead-item:last-child { border-bottom: none; }
    .typeahead-item:hover,
    .typeahead-item.is-active { background: #fef2f2; }
    .typeahead-item-name { font-weight: 600; color: #1a1a2e; }
    .typeahead-item-meta { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .typeahead-empty {
      padding: 9px 12px;
      font-size: 0.85rem;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="/" class="back-link">← Voltar</a>
    <h1>Abrir Chamado Técnico</h1>
    <p>Preencha os dados do chamado para abertura da ordem de serviço.</p>
  </div>

  <form id="form">

    <!-- CLIENTE E CONTATO -->
    <div class="section">
      <div class="section-title">Cliente e Contato</div>
      <div class="grid-2">
        <div class="field full typeahead" id="cliente-typeahead">
          <label>Cliente <span class="req">*</span></label>
          <input type="text" name="cliente" id="cliente-input" placeholder="Ex: Posto Mineirão (comece a digitar para preencher dados salvos)" autocomplete="off" required />
          <div class="typeahead-list" id="cliente-list" role="listbox"></div>
        </div>
        <div class="field">
          <label>Nome do Contato <span class="req">*</span></label>
          <input type="text" name="nomeContato" required />
        </div>
        <div class="field">
          <label>Telefone do Contato <span class="req">*</span></label>
          <input type="tel" name="telefoneContato" placeholder="(11) 99999-9999" required />
        </div>
      </div>
    </div>

    <!-- VENDEDOR -->
    <div class="section">
      <div class="section-title">Vendedor</div>
      <div class="field">
        <label>Nome do Vendedor <span class="req">*</span></label>
        <select name="vendedor" required>
          <option value="" disabled selected>Selecione...</option>
          <option>Marilyn</option>
          <option>Priscila</option>
          <option>Mary</option>
          <option>Thiago</option>
          <option>Eduardo</option>
          <option>Mello</option>
          <option>Márcio</option>
          <option>Fabrício</option>
          <option>Outro</option>
        </select>
      </div>
    </div>

    <!-- SERVIÇO -->
    <div class="section">
      <div class="section-title">Serviço</div>
      <div class="grid-2">
        <div class="field">
          <label>Data do Chamado <span class="req">*</span></label>
          <input type="date" name="dataChamado" id="dataChamado" required />
        </div>
        <div class="field">
          <label>Prazo de Execução <span class="req">*</span></label>
          <input type="text" name="prazoExecucao" placeholder="Ex: 20 dias" required />
        </div>
        <div class="field full">
          <label>Tipo de Serviço <span class="req">*</span></label>
          <div class="choice-grid">
            <label class="choice-card">
              <input type="radio" name="tipoServico" value="Venda" required />
              <span class="choice-card-icon">💰</span>
              <span>Venda</span>
            </label>
            <label class="choice-card">
              <input type="radio" name="tipoServico" value="Locação" required />
              <span class="choice-card-icon">📦</span>
              <span>Locação</span>
            </label>
            <label class="choice-card">
              <input type="radio" name="tipoServico" value="Assistência Técnica" required />
              <span class="choice-card-icon">🔧</span>
              <span>Assistência Técnica</span>
            </label>
          </div>
        </div>
        <div class="field full">
          <label>Endereço do Serviço <span class="req">*</span></label>
          <input type="text" name="enderecoServico" placeholder="Rua, Nº, Bairro, Cidade - UF" required />
        </div>
      </div>
    </div>

    <!-- DEMANDAS -->
    <div class="section">
      <div class="section-title">Demandas</div>
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 12px;">
        Marque tudo que se aplica ao serviço.
      </p>
      <div class="choice-grid">
        <label class="choice-card">
          <input type="checkbox" name="demandas" value="Elétrica" />
          <span class="choice-card-icon">⚡</span>
          <span>Elétrica</span>
        </label>
        <label class="choice-card">
          <input type="checkbox" name="demandas" value="Rede" />
          <span class="choice-card-icon">🌐</span>
          <span>Rede</span>
        </label>
        <label class="choice-card">
          <input type="checkbox" name="demandas" value="Alvenaria" />
          <span class="choice-card-icon">🧱</span>
          <span>Alvenaria</span>
        </label>
        <label class="choice-card">
          <input type="checkbox" name="demandas" value="Disjuntor" />
          <span class="choice-card-icon">🔌</span>
          <span>Disjuntor</span>
        </label>
      </div>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="section">
      <div class="section-title">Observações</div>
      <div class="field full">
        <label>Observações (opcional)</label>
        <textarea name="observacoes" placeholder="Informações adicionais sobre o chamado..." maxlength="5000"></textarea>
      </div>
    </div>

    <!-- Imagem do Projeto -->
    <div class="section">
      <div class="section-title">Imagem do Projeto (opcional)</div>
      <div class="anexos-uploader">
        <label class="upload-zone" for="anexos-input">
          <input type="file" id="anexos-input" name="anexos" multiple accept="image/*" hidden />
          <span class="upload-icon">📎</span>
          <span class="upload-text">Clique para adicionar imagens (até 10, máx. 10MB cada)</span>
        </label>
        <div class="anexos-list" id="anexos-list"></div>
      </div>
    </div>

    <!-- SUBMIT -->
    <div class="submit-section">
      <button type="submit" id="submitBtn">Abrir Chamado</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </div>

  </form>

  <script>
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');

    // Pré-preenche a data do chamado com hoje
    document.getElementById('dataChamado').value = new Date().toISOString().split('T')[0];

    // Autocomplete de cliente: ao digitar, busca clientes cadastrados via
    // form de Pedido de Venda e preenche os outros campos quando o usuário
    // escolhe uma sugestão. Tudo continua editável depois.
    setupClienteTypeahead({
      inputId: 'cliente-input',
      listId: 'cliente-list',
      onSelect: (c) => {
        // Nome do contato e telefone vêm do "responsavel/telefone" salvo.
        if (c.responsavel) document.querySelector('[name="nomeContato"]').value = c.responsavel;
        if (c.telefone) document.querySelector('[name="telefoneContato"]').value = c.telefone;
        // Endereço fica como cidade/UF (não temos endereço completo no cadastro).
        const enderecoEl = document.querySelector('[name="enderecoServico"]');
        if (enderecoEl && !enderecoEl.value && (c.cidade || c.estado)) {
          enderecoEl.value = [c.cidade, c.estado].filter(Boolean).join(' / ');
        }
      },
    });

    function setupClienteTypeahead({ inputId, listId, onSelect }) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);
      let debounceTimer = null;
      let activeIndex = -1;
      let items = [];

      function close() {
        list.classList.remove('is-open');
        activeIndex = -1;
      }
      function render(results) {
        items = results;
        list.innerHTML = '';
        if (results.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'typeahead-empty';
          empty.textContent = 'Nenhum cliente encontrado.';
          list.appendChild(empty);
          list.classList.add('is-open');
          return;
        }
        results.forEach((c, idx) => {
          const item = document.createElement('div');
          item.className = 'typeahead-item';
          item.setAttribute('role', 'option');
          const meta = [c.tipo, [c.cidade, c.estado].filter(Boolean).join('/')]
            .filter(Boolean)
            .join(' · ');
          const nameEl = document.createElement('div');
          nameEl.className = 'typeahead-item-name';
          nameEl.textContent = c.name;
          item.appendChild(nameEl);
          if (meta) {
            const metaEl = document.createElement('div');
            metaEl.className = 'typeahead-item-meta';
            metaEl.textContent = meta;
            item.appendChild(metaEl);
          }
          item.addEventListener('mousedown', (e) => {
            // mousedown (não click) porque blur do input dispara antes do click.
            e.preventDefault();
            select(idx);
          });
          list.appendChild(item);
        });
        list.classList.add('is-open');
      }
      function select(idx) {
        const c = items[idx];
        if (!c) return;
        input.value = c.name;
        onSelect(c);
        close();
      }
      function highlight(idx) {
        const els = list.querySelectorAll('.typeahead-item');
        els.forEach((el, i) => el.classList.toggle('is-active', i === idx));
      }
      async function fetchAndRender() {
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        try {
          const res = await fetch('/api/clientes/search?q=' + encodeURIComponent(q));
          const body = await res.json();
          render(body.items || []);
        } catch {
          close();
        }
      }
      input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(fetchAndRender, 200);
      });
      input.addEventListener('keydown', (e) => {
        if (!list.classList.contains('is-open')) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = Math.min(activeIndex + 1, items.length - 1);
          highlight(activeIndex);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          highlight(activeIndex);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
          e.preventDefault();
          select(activeIndex);
        } else if (e.key === 'Escape') {
          close();
        }
      });
      input.addEventListener('blur', () => {
        // Pequeno delay pra deixar o mousedown rodar primeiro.
        setTimeout(close, 120);
      });
    }

    // Anexos: render selected files + allow removal via DataTransfer.
    const anexosInput = document.getElementById('anexos-input');
    const anexosList = document.getElementById('anexos-list');
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    function renderAnexos() {
      anexosList.innerHTML = '';
      Array.from(anexosInput.files).forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'anexos-item';
        const info = document.createElement('div');
        info.className = 'anexos-item-info';
        info.innerHTML = '<span>📎</span><span class="anexos-item-name"></span><span class="anexos-item-size"></span>';
        info.querySelector('.anexos-item-name').textContent = file.name;
        info.querySelector('.anexos-item-size').textContent = formatSize(file.size);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'anexos-item-remove';
        btn.setAttribute('aria-label', 'Remover');
        btn.textContent = '×';
        btn.addEventListener('click', () => removeAnexo(idx));
        item.appendChild(info);
        item.appendChild(btn);
        anexosList.appendChild(item);
      });
    }
    function removeAnexo(index) {
      const dt = new DataTransfer();
      Array.from(anexosInput.files).forEach((f, i) => {
        if (i !== index) dt.items.add(f);
      });
      anexosInput.files = dt.files;
      renderAnexos();
    }
    anexosInput.addEventListener('change', renderAnexos);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const fd = new FormData();
      for (const el of form.elements) {
        if (!el.name || el.disabled) continue;
        if (el.type === 'file') continue; // tratado abaixo via anexosInput
        if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) continue;
        if (el.value !== '') fd.append(el.name, el.value);
      }
      for (const file of anexosInput.files) {
        fd.append('anexos', file);
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="btn-loading"><span class="spinner"></span> Abrindo chamado...</span>';

      try {
        const res = await fetch('/api/manutencao', {
          method: 'POST',
          body: fd,
        });
        const body = await res.json();

        if (res.ok && body.ok) {
          showSuccess(body.os);
        } else {
          showError(body.error || 'Erro inesperado. Tente novamente.');
        }
      } catch {
        showError('Falha na conexão. Tente novamente.');
      }
    });

    function showSuccess(os) {
      const overlay = document.createElement('div');
      overlay.className = 'success-overlay';
      overlay.innerHTML = `
        <div class="success-card">
          <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
          </div>
          <h2>Chamado aberto!</h2>
          <p>Sua ordem de serviço foi registrada:</p>
          <div class="os-badge">OS Nº ${os}</div>
          <p style="margin-bottom: 28px;">A equipe técnica foi notificada e entrará em contato em breve.</p>
          <button class="btn-new" onclick="location.reload()">Abrir outro chamado</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function showError(msg) {
      messageEl.className = 'error';
      messageEl.innerHTML = '<strong>Erro:</strong> ' + msg;
      messageEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Abrir Chamado';
    }

    function clearMessage() {
      messageEl.className = '';
      messageEl.innerHTML = '';
    }
  </script>
</body>
</html>
