<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido de Artes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 32px 16px 64px;
      color: #222;
    }

    .page-header {
      max-width: 680px;
      margin: 0 auto 24px;
    }

    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1a1a2e;
    }

    .page-header p {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #666;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #4f6bed;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover { text-decoration: underline; }

    .section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.08);
      padding: 28px 32px;
      max-width: 680px;
      margin: 0 auto 20px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #4f6bed;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eef0fb;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    /* Bandeira (mais larga) | Cidade (mais larga) | Estado (estreito, só UF) */
    .grid-bandeira {
      display: grid;
      grid-template-columns: 1.4fr 1.4fr 0.6fr;
      gap: 16px;
    }
    @media (max-width: 560px) {
      .grid-bandeira { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .section { padding: 20px 18px; }
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    label .req { color: #e53e3e; margin-left: 2px; }

    input[type="text"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 0.93rem;
      font-family: inherit;
      color: #222;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
      width: 100%;
      height: 40px;
      line-height: 1.2;
    }

    textarea {
      height: auto;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #4f6bed;
    }

    textarea { resize: vertical; min-height: 100px; }

    /* Radio group */
    .radio-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      color: #333;
    }

    .radio-group input[type="radio"] {
      width: 16px; height: 16px;
      accent-color: #4f6bed;
      cursor: pointer;
    }

    /* Combustíveis: cada linha = checkbox (se vende esse) + input do preço */
    .fuels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }

    @media (max-width: 560px) {
      .fuels-grid { grid-template-columns: 1fr; }
    }

    .fuel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1.5px solid #e2e6ee;
      border-radius: 8px;
      background: #fafbfd;
      transition: border-color 0.15s, background 0.15s;
    }

    .fuel-item.is-active {
      border-color: #4f6bed;
      background: #eef2ff;
    }

    .fuel-item .fuel-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 0 0 auto;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      text-transform: none;
      letter-spacing: 0;
      min-width: 130px;
    }

    .fuel-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4f6bed;
      cursor: pointer;
    }

    .fuel-item input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      font-size: 0.92rem;
    }

    .fuel-item input[type="text"]:disabled {
      background: #f1f3f7;
      color: #aaa;
      cursor: not-allowed;
    }

    /* Telefone: ocupa a célula inteira do grid (igual aos outros inputs)
       e usa números tabulares pra a máscara ficar mais legível. */
    .phone-input {
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    /* Attachments uploader */
    .anexos-uploader { display: flex; flex-direction: column; gap: 12px; }
    .upload-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 24px; border: 2px dashed #cbd5e1; border-radius: 10px;
      background: #f8fafc; cursor: pointer; transition: border-color .15s, background .15s;
      text-align: center;
    }
    .upload-zone:hover { border-color: #4f6bed; background: #eef0fb; }
    .upload-icon { font-size: 1.5rem; }
    .upload-text { font-size: 0.88rem; color: #555; }
    .anexos-list { display: flex; flex-direction: column; gap: 6px; }
    .anexos-list:empty { display: none; }
    .anexos-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #f1f5f9; border-radius: 6px; font-size: 0.85rem;
    }
    .anexos-item-info { display: flex; gap: 8px; align-items: center; overflow: hidden; min-width: 0; }
    .anexos-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .anexos-item-size { color: #888; font-size: 0.78rem; flex-shrink: 0; }
    .anexos-item-remove {
      background: transparent; border: none; cursor: pointer; color: #b91c1c;
      font-size: 1.2rem; padding: 0 6px; line-height: 1;
    }

    /* Submit area */
    .submit-section {
      max-width: 680px;
      margin: 0 auto;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #4f6bed;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button[type="submit"]:hover:not(:disabled) { background: #3a56d4; }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 9px;
      font-size: 0.92rem;
      display: none;
    }

    #message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      display: block;
      animation: shake .4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* Loading spinner inside button */
    .btn-loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      text-align: center;
      max-width: 460px;
      width: 90%;
      animation: slideUp .5s cubic-bezier(.22,.68,0,1.1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: popIn .5s cubic-bezier(.22,.68,0,1.3) .2s both;
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .success-icon svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-icon svg path {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck .4s ease .5s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .success-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .success-card p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn-new {
      display: inline-block;
      padding: 12px 32px;
      background: #4f6bed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-new:hover { background: #3a56d4; }

    .btn-secondary-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #888;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-secondary-link:hover { color: #555; }

    /* Typeahead (autocomplete de cliente) */
    .typeahead { position: relative; }
    .typeahead-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1.5px solid #4f6bed;
      border-radius: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      z-index: 10;
      display: none;
    }
    .typeahead-list.is-open { display: block; }
    .typeahead-item {
      padding: 9px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }
    .typeahead-item:last-child { border-bottom: none; }
    .typeahead-item:hover,
    .typeahead-item.is-active { background: #eef0fb; }
    .typeahead-item-name { font-weight: 600; color: #1a1a2e; }
    .typeahead-item-meta { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .typeahead-empty {
      padding: 9px 12px;
      font-size: 0.85rem;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="/" class="back-link">← Voltar</a>
    <h1>Formulário — Pedido de Artes</h1>
    <p>Preencha todos os campos para abrir o chamado de pedido de arte no LED.</p>
  </div>

  <form id="form">

    <!-- IDENTIFICAÇÃO -->
    <div class="section">
      <div class="section-title">Identificação do Posto</div>

      <div class="field typeahead" id="cliente-typeahead" style="margin-bottom: 16px;">
        <label>Nome do Posto <span class="req">*</span></label>
        <input type="text" name="NOME DO POSTO" id="cliente-input" placeholder="Comece a digitar para usar dados salvos" autocomplete="off" required />
        <div class="typeahead-list" id="cliente-list" role="listbox"></div>
      </div>

      <!-- Bandeira / Cidade / Estado em 3 colunas (Estado é só UF) -->
      <div class="grid-bandeira" style="margin-bottom: 16px;">
        <div class="field">
          <label>Bandeira <span class="req">*</span></label>
          <select name="BANDEIRA" required>
            <option value="" disabled selected>Selecione...</option>
            <option>SHELL</option>
            <option>PETROBRAS</option>
            <option>IPIRANGA</option>
            <option>ALE</option>
            <option>PETRONAS</option>
            <option>RODOIL</option>
            <option>BANDEIRA BRANCA</option>
          </select>
        </div>
        <div class="field">
          <label>Cidade <span class="req">*</span></label>
          <input type="text" name="CIDADE" required />
        </div>
        <div class="field">
          <label>Estado <span class="req">*</span></label>
          <input type="text" name="ESTADO" placeholder="Ex: SP" maxlength="2" required />
        </div>
      </div>

      <!-- Nome do Responsável e Telefone lado a lado -->
      <div class="grid-2">
        <div class="field">
          <label>Nome do Responsável</label>
          <input type="text" name="NOME RESPONSÁVEL" />
        </div>
        <div class="field">
          <label>Telefone do Responsável</label>
          <input
            type="tel"
            name="TLEFONE RESPONSÁVEL"
            id="telefone"
            class="phone-input"
            placeholder="(00) 00000-0000"
            maxlength="15"
          />
        </div>
      </div>
    </div>

    <!-- EQUIPAMENTO -->
    <div class="section">
      <div class="section-title">Equipamento</div>
      <div class="grid-2">
        <div class="field full">
          <label>Equipamento</label>
          <input type="text" name="EQUIPAMENTO" />
        </div>
        <div class="field">
          <label>Previsão da Instalação</label>
          <input type="date" name="PREVISÃO DA INSTALAÇÃO" />
        </div>
        <div class="field">
          <label>Medida do LED</label>
          <input type="text" name="MEDIDA DO LED" placeholder="Ex: 3x2" />
        </div>
        <div class="field">
          <label>Tipo LED <span class="req">*</span></label>
          <select name="TIPO LED" required>
            <option value="" disabled selected>Selecione...</option>
            <option>P5 OUTDOOR</option>
            <option>P3.9 OUTDOOR</option>
            <option>P3.9 INDOOR</option>
            <option>P2.5 OUTDOOR</option>
            <option>P2.5 INDOOR</option>
            <option>P1 INDOOR</option>
            <option>P1 OUTDOOR</option>
            <option>OUTROS</option>
          </select>
        </div>
        <div class="field">
          <label>Tipo de Negociação <span class="req">*</span></label>
          <select name="TIPO DE NEGOCIAÇÃO" required>
            <option value="" disabled selected>Selecione...</option>
            <option>VENDA</option>
            <option>LOCAÇÃO</option>
            <option>DEGUSTAÇÃO</option>
          </select>
        </div>
      </div>
    </div>

    <!-- COMBUSTÍVEIS -->
    <div class="section">
      <div class="section-title">Preços dos Combustíveis</div>
      <p style="font-size: 0.85rem; color: #666; margin-bottom: 14px;">
        Marque apenas os combustíveis que o posto vende e informe o preço de cada um.
      </p>
      <div class="fuels-grid" id="fuelsGrid">
        <!-- gerado dinamicamente pelo JS abaixo -->
      </div>
    </div>

    <!-- COMERCIAL -->
    <div class="section">
      <div class="section-title">Comercial</div>
      <div class="grid-2">
        <div class="field full">
          <label>Rodar Comercial PDVIEW no Loop?</label>
          <div class="radio-group">
            <label><input type="radio" name="RODAR COMERCIAL PDVIEW NO LOOP" value="SIM" /> SIM</label>
            <label><input type="radio" name="RODAR COMERCIAL PDVIEW NO LOOP" value="NÃO" /> NÃO</label>
          </div>
        </div>
        <div class="field">
          <label>Vendedor <span class="req">*</span></label>
          <select name="VENDEDOR" required>
            <option value="" disabled selected>Selecione...</option>
            <option>MELLO</option>
            <option>PRISCILA</option>
            <option>MARILYN</option>
            <option>THIAGO</option>
            <option>MARCIO</option>
            <option>EDUARDO</option>
            <option>FABRICIO</option>
            <option>OUTROS</option>
          </select>
        </div>
        <div class="field">
          <label>Data <span class="req">*</span></label>
          <input type="date" name="DATA" required />
        </div>
      </div>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="section">
      <div class="section-title">Observações</div>
      <div class="field">
        <label>Observações</label>
        <textarea name="OBSERVAÇÕES" placeholder="Informações adicionais..."></textarea>
      </div>
    </div>

    <!-- Anexos (opcional) -->
    <div class="section">
      <div class="section-title">Anexos (opcional)</div>
      <div class="anexos-uploader">
        <label class="upload-zone" for="anexos-input">
          <input type="file" id="anexos-input" name="anexos" multiple accept="image/*" hidden />
          <span class="upload-icon">📎</span>
          <span class="upload-text">Clique para adicionar imagens (até 10, máx. 10MB cada)</span>
        </label>
        <div class="anexos-list" id="anexos-list"></div>
      </div>
    </div>

    <!-- SUBMIT -->
    <div class="submit-section">
      <button type="submit" id="submitBtn">Enviar Pedido</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </div>

  </form>

  <script>
    // Lista de combustíveis: { name: nome do field do form, label: rótulo na UI }
    const FUELS = [
      { name: 'PREÇO GASOLINA COMUM',     label: 'Gasolina Comum' },
      { name: 'PREÇO GASOLINA ADITIVADA', label: 'Gasolina Aditivada' },
      { name: 'GASOINA PODIUM',           label: 'Gasolina Pódium' },
      { name: 'PREÇO ETANOL',             label: 'Etanol' },
      { name: 'PREÇO DIESEL',             label: 'Diesel' },
      { name: 'PREÇO DIESEL S 10',        label: 'Diesel S10' },
      { name: 'ARLA',                     label: 'ARLA' },
      { name: 'PREÇO GNV',                label: 'GNV' },
    ];

    // Renderiza dinamicamente os pares checkbox + input.
    const fuelsGrid = document.getElementById('fuelsGrid');
    for (const f of FUELS) {
      const item = document.createElement('div');
      item.className = 'fuel-item';
      item.innerHTML = `
        <label class="fuel-label">
          <input type="checkbox" data-fuel="${f.name}" />
          ${f.label}
        </label>
        <input type="text" name="${f.name}" placeholder="R$ 0,00" disabled />
      `;
      fuelsGrid.appendChild(item);

      const checkbox = item.querySelector('input[type="checkbox"]');
      const priceInput = item.querySelector('input[type="text"]');

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          priceInput.disabled = false;
          item.classList.add('is-active');
          priceInput.focus();
        } else {
          priceInput.disabled = true;
          priceInput.value = '';
          item.classList.remove('is-active');
        }
      });
    }

    // Pre-fill today's date
    const today = new Date().toISOString().split('T')[0];
    document.querySelector('[name="DATA"]').value = today;

    // Autocomplete de cliente: ao digitar o nome do posto, busca registros
    // cadastrados via form de Pedido de Venda e preenche o resto dos campos
    // (Bandeira, Cidade, UF, Responsável, Telefone) — todos editáveis.
    setupClienteTypeahead({
      inputId: 'cliente-input',
      listId: 'cliente-list',
      onSelect: (c) => {
        const setIfEmpty = (selector, value) => {
          if (!value) return;
          const el = document.querySelector(selector);
          if (el && !el.value) el.value = value;
        };
        // Bandeira do Posto — select com options em uppercase.
        if (c.tipo === 'Posto' && c.bandeira) {
          const bandeiraEl = document.querySelector('[name="BANDEIRA"]');
          if (bandeiraEl && !bandeiraEl.value) {
            const wanted = String(c.bandeira).toUpperCase().trim();
            const match = Array.from(bandeiraEl.options).find(
              (o) => o.value.toUpperCase() === wanted,
            );
            if (match) bandeiraEl.value = match.value;
          }
        }
        setIfEmpty('[name="CIDADE"]', c.cidade);
        if (c.estado) {
          const ufEl = document.querySelector('[name="ESTADO"]');
          if (ufEl && !ufEl.value) ufEl.value = String(c.estado).toUpperCase().slice(0, 2);
        }
        setIfEmpty('[name="NOME RESPONSÁVEL"]', c.responsavel);
        setIfEmpty('[name="TLEFONE RESPONSÁVEL"]', c.telefone);
      },
    });

    function setupClienteTypeahead({ inputId, listId, onSelect }) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);
      let debounceTimer = null;
      let activeIndex = -1;
      let items = [];

      function close() {
        list.classList.remove('is-open');
        activeIndex = -1;
      }
      function render(results) {
        items = results;
        list.innerHTML = '';
        if (results.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'typeahead-empty';
          empty.textContent = 'Nenhum cliente encontrado.';
          list.appendChild(empty);
          list.classList.add('is-open');
          return;
        }
        results.forEach((c, idx) => {
          const item = document.createElement('div');
          item.className = 'typeahead-item';
          item.setAttribute('role', 'option');
          const meta = [c.tipo, [c.cidade, c.estado].filter(Boolean).join('/')]
            .filter(Boolean)
            .join(' · ');
          const nameEl = document.createElement('div');
          nameEl.className = 'typeahead-item-name';
          nameEl.textContent = c.name;
          item.appendChild(nameEl);
          if (meta) {
            const metaEl = document.createElement('div');
            metaEl.className = 'typeahead-item-meta';
            metaEl.textContent = meta;
            item.appendChild(metaEl);
          }
          item.addEventListener('mousedown', (e) => {
            e.preventDefault();
            select(idx);
          });
          list.appendChild(item);
        });
        list.classList.add('is-open');
      }
      function select(idx) {
        const c = items[idx];
        if (!c) return;
        input.value = c.name;
        onSelect(c);
        close();
      }
      function highlight(idx) {
        const els = list.querySelectorAll('.typeahead-item');
        els.forEach((el, i) => el.classList.toggle('is-active', i === idx));
      }
      async function fetchAndRender() {
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        try {
          const res = await fetch('/api/clientes/search?q=' + encodeURIComponent(q));
          const body = await res.json();
          render(body.items || []);
        } catch {
          close();
        }
      }
      input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(fetchAndRender, 200);
      });
      input.addEventListener('keydown', (e) => {
        if (!list.classList.contains('is-open')) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = Math.min(activeIndex + 1, items.length - 1);
          highlight(activeIndex);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          highlight(activeIndex);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
          e.preventDefault();
          select(activeIndex);
        } else if (e.key === 'Escape') {
          close();
        }
      });
      input.addEventListener('blur', () => {
        setTimeout(close, 120);
      });
    }

    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');

    // Anexos: render selected files + allow removal via DataTransfer.
    const anexosInput = document.getElementById('anexos-input');
    const anexosList = document.getElementById('anexos-list');
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    function renderAnexos() {
      anexosList.innerHTML = '';
      Array.from(anexosInput.files).forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'anexos-item';
        const info = document.createElement('div');
        info.className = 'anexos-item-info';
        info.innerHTML = '<span>📎</span><span class="anexos-item-name"></span><span class="anexos-item-size"></span>';
        info.querySelector('.anexos-item-name').textContent = file.name;
        info.querySelector('.anexos-item-size').textContent = formatSize(file.size);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'anexos-item-remove';
        btn.setAttribute('aria-label', 'Remover');
        btn.textContent = '×';
        btn.addEventListener('click', () => removeAnexo(idx));
        item.appendChild(info);
        item.appendChild(btn);
        anexosList.appendChild(item);
      });
    }
    function removeAnexo(index) {
      const dt = new DataTransfer();
      Array.from(anexosInput.files).forEach((f, i) => {
        if (i !== index) dt.items.add(f);
      });
      anexosInput.files = dt.files;
      renderAnexos();
    }
    anexosInput.addEventListener('change', renderAnexos);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const fd = new FormData();
      const elements = form.elements;

      for (const el of elements) {
        if (!el.name || el.disabled) continue;
        if (el.type === 'file') continue; // tratado abaixo via anexosInput
        if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) continue;
        if (el.value !== '') fd.append(el.name, el.value);
      }
      for (const file of anexosInput.files) {
        fd.append('anexos', file);
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="btn-loading"><span class="spinner"></span> Enviando...</span>';

      try {
        const res = await fetch('/api/gforms', {
          method: 'POST',
          body: fd,
        });

        const body = await res.json();

        if (res.ok && body.ok) {
          showSuccess();
        } else {
          showError(body.error || 'Erro inesperado. Tente novamente.');
        }
      } catch {
        showError('Falha na conexão. Verifique sua internet e tente novamente.');
      }
    });

    function showSuccess() {
      const overlay = document.createElement('div');
      overlay.className = 'success-overlay';
      overlay.innerHTML = `
        <div class="success-card">
          <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" /></svg>
          </div>
          <h2>Pedido enviado!</h2>
          <p>O card foi criado no board e o time de artes já pode visualizar a demanda.</p>
          <a class="btn-new" href="/">Voltar para a Central de Formulários</a>
          <div><button class="btn-secondary-link" onclick="location.reload()">ou enviar outro pedido de arte</button></div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function showError(msg) {
      messageEl.className = 'error';
      messageEl.innerHTML = '<strong>Erro:</strong> ' + msg;
      messageEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar Pedido';
    }

    function clearMessage() {
      messageEl.className = '';
      messageEl.innerHTML = '';
    }

    // Máscara de telefone: (DD) 9XXXX-XXXX
    document.getElementById('telefone').addEventListener('input', function (e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0,2)}) ${v.slice(2)}`;
      } else if (v.length > 0) {
        v = `(${v}`;
      }
      e.target.value = v;
    });
  </script>
</body>
</html>
